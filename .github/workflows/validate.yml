name: Validate Sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "New URLs to add, separated by commas (optional)"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - sources.yaml
      - sources.manual.yaml

permissions:
  contents: write

concurrency:
  group: validate-sources
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: Add URLs from input
        if: github.event.inputs.urls != ''
        env:
          NEW_URLS: ${{ github.event.inputs.urls }}
        run: python src/add_sources.py "$NEW_URLS"

      - name: Validate sources.yaml
        run: python src/validate_sources.py

      - name: Commit changes
        run: |
          git config user.name "pantau-loker-bot"
          git config user.email "actions@github.com"
          git add sources.yaml sources.validated.yaml
          git diff --cached --quiet || git commit -m "chore: update sources"
          git push
