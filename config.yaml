# Global settings. Safe to commit -- no secrets or user-specific data here.
# The list of sites to monitor lives in sources.yaml, not here.

threshold: 80 # minimum match score (0-100) that triggers a Telegram notification

matching:
  requests_per_minute: 20 # most Groq free-tier chat models allow 30/min; this leaves headroom
  max_per_run: 40 # cap on jobs scored per run; the rest are picked up in later runs
  max_per_day: 200 # most Groq free-tier chat models allow 1,000/day; this leaves plenty of headroom
  max_tokens_per_day: 180000 # your model's real bottleneck is often tokens/day, not requests/day; check console.groq.com/settings/limits

validation:
  max_sources: 50 # max URLs validated per run
  request_delay_seconds: 1.5 # delay between requests while validating
